services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: pixelpulse_production
      POSTGRES_USER: pixelpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://pixelpulse:${POSTGRES_PASSWORD}@db:5432/pixelpulse_production
      RAILS_ENV: production
    ports:
      - "3001:80"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: always
    env_file:
      - .env
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data: