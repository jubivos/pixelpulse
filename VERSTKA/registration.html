<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>RETRO GAME FORUM | Регистрация</title>
    <style>
        /* ========== ИМПОРТ ШРИФТА ========== */
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        /* ========== ПЕРЕМЕННЫЕ ========== */
        :root {
            --primary: #ff0;
            --secondary: #0f0;
            --ghost-red: #f00;
            --ghost-pink: #f0f;
            --ghost-cyan: #0ff;
            --ghost-orange: #ff8c00;
            --bg-dark: #000;
            --bg-light: #111;
            --neon-glow: 0 0 10px currentColor, 0 0 20px currentColor;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="%23ff0" /></svg>') 12 12, auto;
        }

        body {
            font-family: 'Press Start 2P', cursive;
            background-color: var(--bg-dark);
            color: var(--secondary);
            line-height: 1.6;
            font-size: 12px;
            position: relative;
            overflow-x: hidden;
        }

        /* Эффект ЭЛТ */
        .crt::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,255,0,0.05) 1px, transparent 2px);
            pointer-events: none;
            z-index: 100;
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 10px;
            background: rgba(0,255,0,0.1);
            opacity: 0.75;
            animation: scan 8s linear infinite;
            pointer-events: none;
            z-index: 101;
        }

        @keyframes scan {
            0% { top: -10px; }
            100% { top: 110%; }
        }

        /* Тряска */
        @keyframes shake {
            0% { transform: translate(0); }
            25% { transform: translate(-5px, 0); }
            50% { transform: translate(5px, 0); }
            75% { transform: translate(-2px, 0); }
            100% { transform: translate(0); }
        }

        /* Бегущая строка */
        .marquee {
            background: #222;
            color: var(--primary);
            padding: 8px 0;
            overflow: hidden;
            white-space: nowrap;
            border: 2px solid var(--secondary);
            margin-bottom: 20px;
        }

        .marquee-content {
            display: inline-block;
            animation: marquee 20s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Шапка */
        .pacman-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .pacman-animation {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #000;
            padding: 10px;
            border: 2px solid var(--secondary);
            border-radius: 30px;
        }

        .pacman {
            width: 0;
            height: 0;
            border-right: 15px solid transparent;
            border-top: 15px solid var(--primary);
            border-left: 15px solid var(--primary);
            border-bottom: 15px solid var(--primary);
            border-radius: 50%;
            animation: chomp 0.3s infinite;
        }

        @keyframes chomp {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(30deg); }
        }

        .ghost {
            width: 25px;
            height: 25px;
            border-radius: 50% 50% 0 0;
            position: relative;
            animation: float 2s infinite;
        }

        .ghost::after {
            content: "";
            position: absolute;
            bottom: -6px;
            left: 4px;
            width: 6px;
            height: 6px;
            background: inherit;
            border-radius: 50%;
            box-shadow: 8px 0 0 inherit, 16px 0 0 inherit;
        }

        .ghost.red { background-color: var(--ghost-red); }
        .ghost.pink { background-color: var(--ghost-pink); }
        .ghost.cyan { background-color: var(--ghost-cyan); }
        .ghost.orange { background-color: var(--ghost-orange); }

        .dot {
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        h1 {
            font-size: 20px;
            color: var(--primary);
            text-shadow: 4px 4px 0 blue, 0 0 20px var(--primary);
            letter-spacing: 2px;
        }

        .online-indicator {
            background: #111;
            border: 2px solid var(--secondary);
            padding: 10px 20px;
            color: var(--ghost-cyan);
            font-size: 14px;
            box-shadow: var(--neon-glow);
        }

        /* Навигация */
        nav ul {
            display: flex;
            justify-content: space-around;
            list-style: none;
            border: 4px solid var(--secondary);
            padding: 10px;
            background: linear-gradient(45deg, #000, #222);
            box-shadow: 0 0 20px var(--secondary);
        }

        nav a {
            color: var(--secondary);
            text-decoration: none;
            padding: 12px 24px;
            border: 2px solid transparent;
            position: relative;
            transition: 0.3s;
            font-size: 14px;
            text-transform: uppercase;
        }

        nav a::before {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--primary);
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: perspective(400px) rotateX(90deg);
            transform-origin: bottom;
            transition: 0.3s;
            pointer-events: none;
        }

        nav a:hover::before,
        nav a.active::before {
            transform: perspective(400px) rotateX(0deg);
        }

        nav a:hover,
        nav a.active {
            color: transparent;
        }

        /* Форма регистрации */
        .form-container {
            max-width: 500px;
            margin: 40px auto;
            background: #111;
            border: 4px solid var(--secondary);
            padding: 30px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
            position: relative;
        }

        .form-container h2 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 20px;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--secondary);
            margin-bottom: 8px;
            font-size: 12px;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            background: #000;
            border: 2px solid var(--secondary);
            padding: 12px;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            color: var(--primary);
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary);
        }

        .form-group input::placeholder {
            color: #444;
            font-size: 10px;
        }

        .arcade-button {
            background: #111;
            border: 3px solid var(--primary);
            color: var(--primary);
            padding: 12px 20px;
            width: 100%;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .arcade-button:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 20px var(--primary);
        }

        .form-footer {
            text-align: center;
            margin-top: 25px;
            font-size: 11px;
        }

        .form-footer a {
            color: var(--ghost-cyan);
            text-decoration: none;
            border-bottom: 1px dashed var(--ghost-cyan);
            transition: 0.3s;
        }

        .form-footer a:hover {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* Canvas анимации Пакмана */
        .pacman-canvas-container {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }

        #pacmanCanvas {
            background-color: #000;
            border: 2px solid var(--secondary);
            border-radius: 8px;
            display: none;
            width: 100%;
            height: auto;
            max-width: 450px;
        }

        .success-message {
            text-align: center;
            color: var(--primary);
            font-size: 14px;
            margin-top: 20px;
            display: none;
            text-shadow: 0 0 5px var(--primary);
            animation: blink 1s infinite;
        }

        /* Футер */
        footer {
            margin-top: 60px;
            padding: 20px 0;
            border-top: 4px solid var(--secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .footer-left {
            display: flex;
            gap: 30px;
        }

        .player-indicator {
            color: var(--primary);
            animation: blink 1s infinite;
        }

        .highscore {
            color: var(--ghost-cyan);
        }

        .arcade-btn {
            background: #111;
            border: 3px solid var(--primary);
            color: var(--primary);
            padding: 12px 24px;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 15px var(--primary);
            text-transform: uppercase;
        }

        .arcade-btn:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 30px var(--primary);
        }

        .arcade-btn:active {
            transform: scale(0.95);
        }

        .footer-right {
            display: flex;
            gap: 15px;
        }

        .social-link {
            color: var(--secondary);
            font-size: 20px;
            text-decoration: none;
            transition: 0.3s;
            filter: drop-shadow(0 0 5px var(--secondary));
        }

        .social-link:hover {
            color: var(--primary);
            transform: scale(1.2);
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            body {
                font-size: 12px;
            }
            .marquee {
                font-size: 10px;
            }
            nav ul {
                flex-direction: column;
                gap: 10px;
                padding: 15px;
            }
            nav a {
                display: block;
                text-align: center;
                padding: 15px;
                font-size: 14px;
                border: 2px solid var(--secondary);
                width: 100%;
            }
            nav a::before {
                display: none;
            }
            nav a:hover,
            nav a.active {
                background: var(--primary);
                color: #000;
                border-color: var(--primary);
            }
            .form-container {
                margin: 20px;
            }
            footer {
                flex-direction: column;
                text-align: center;
                gap: 20px;
            }
            .footer-left {
                justify-content: center;
            }
            .arcade-btn {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="crt"></div>
    <div class="scanline"></div>

    <div class="arcade-container">
        <header>
            <div class="marquee">
                <div class="marquee-content">
                    <span>✦ RETRO GAME FORUM ✦ JOIN THE DISCUSSION ✦ HIGH SCORE 123456 ✦ READY PLAYER ONE ✦</span>
                </div>
            </div>

            <div class="pacman-header">
                <div class="pacman-animation">
                    <div class="pacman"></div>
                    <div class="ghost red"></div>
                    <div class="ghost pink"></div>
                    <div class="ghost cyan"></div>
                    <div class="ghost orange"></div>
                    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                </div>
                <h1>RETRO GAME FORUM</h1>
                <div class="online-indicator">ONLINE: <span id="onlineCount">128</span></div>
            </div>

            <nav>
                <ul>
                    <li><a href="#" data-text="ГЛАВНАЯ">ГЛАВНАЯ</a></li>
                    <li><a href="#" data-text="НОВОСТИ">НОВОСТИ</a></li>
                    <li><a href="#" data-text="ОБЗОРЫ">ОБЗОРЫ</a></li>
                    <li><a href="#" data-text="ФОРУМ">ФОРУМ</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <div class="form-container">
                <h2>🔴 РЕГИСТРАЦИЯ 🔴</h2>
                <form id="registerForm">
                    <div class="form-group">
                        <label>👤 ИМЯ ПОЛЬЗОВАТЕЛЯ</label>
                        <input type="text" id="regUsername" placeholder="PLAYER1" required>
                    </div>
                    <div class="form-group">
                        <label>📧 EMAIL</label>
                        <input type="email" id="regEmail" placeholder="player@arcade.com" required>
                    </div>
                    <div class="form-group">
                        <label>🔒 ПАРОЛЬ</label>
                        <input type="password" id="regPassword" placeholder="******" required>
                    </div>
                    <div class="form-group">
                        <label>🔁 ПОДТВЕРЖДЕНИЕ</label>
                        <input type="password" id="regConfirm" placeholder="******" required>
                    </div>
                    <button type="submit" class="arcade-button">➡ СОЗДАТЬ АККАУНТ</button>
                    <div class="form-footer">
                        Уже есть аккаунт? <a href="#" id="loginMockLink">ВОЙТИ →</a>
                    </div>
                </form>

                <!-- Контейнер для анимации Пакмана -->
                <div class="pacman-canvas-container">
                    <canvas id="pacmanCanvas" width="400" height="80"></canvas>
                </div>
                <div class="success-message" id="successMessage">✅ РЕГИСТРАЦИЯ УСПЕШНА! ✅</div>
            </div>
        </main>

        <footer>
            <div class="footer-left">
                <span class="player-indicator">1UP</span>
                <span class="highscore">HIGH SCORE 123456</span>
            </div>
            <div class="footer-center">
                <button class="arcade-btn" id="joinBtn">ПРИСОЕДИНИТЬСЯ</button>
            </div>
            <div class="footer-right">
                <a href="#" class="social-link">📘</a>
                <a href="#" class="social-link">🐦</a>
                <a href="#" class="social-link">📺</a>
                <a href="#" class="social-link">👾</a>
            </div>
        </footer>
    </div>

    <script>
        (function() {
            // ========== 1. АНИМАЦИЯ ПАКМАНА (успешная регистрация) ==========
            const form = document.getElementById('registerForm');
            const canvas = document.getElementById('pacmanCanvas');
            const ctx = canvas.getContext('2d');
            const successMsgDiv = document.getElementById('successMessage');

            let animationActive = false;
            let animationFrame = null;
            let posX = 0;
            let dots = [];
            let pacmanMouthAngle = 0;
            let mouthDirection = 1;
            let animationCompleted = false;
            let smileFrame = 0;

            const PACMAN_RADIUS = 20;
            const DOT_RADIUS = 3;
            const DOT_COUNT = 12;
            const START_X = 30;
            const END_X = canvas.width - 30;
            const STEP = 2;

            function initDots() {
                dots = [];
                const spacing = (canvas.width - 80) / (DOT_COUNT - 1);
                for (let i = 0; i < DOT_COUNT; i++) {
                    dots.push({ x: 40 + i * spacing, y: canvas.height / 2, active: true });
                }
            }

            function drawPacman(x, y, angle) {
                ctx.save();
                ctx.translate(x, y);
                ctx.beginPath();
                ctx.arc(0, 0, PACMAN_RADIUS, angle, 2 * Math.PI - angle);
                ctx.lineTo(0, 0);
                ctx.fillStyle = '#ff0';
                ctx.fill();
                ctx.restore();
            }

            function drawSmile(x, y) {
                ctx.beginPath();
                ctx.arc(x, y, PACMAN_RADIUS * 0.7, 0.1 * Math.PI, 0.9 * Math.PI, false);
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(x - 8, y - 5, 3, 0, 2 * Math.PI);
                ctx.fillStyle = '#000';
                ctx.fill();
            }

            function animatePacman() {
                if (!animationActive) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let dot of dots) {
                    if (dot.active) {
                        ctx.beginPath();
                        ctx.arc(dot.x, dot.y, DOT_RADIUS, 0, 2 * Math.PI);
                        ctx.fillStyle = '#fff';
                        ctx.fill();
                    }
                }
                if (!animationCompleted) {
                    posX += STEP;
                    if (posX > END_X) {
                        posX = END_X;
                        animationCompleted = true;
                        for (let dot of dots) dot.active = false;
                    } else {
                        for (let dot of dots) {
                            if (dot.active && Math.abs(dot.x - posX) < PACMAN_RADIUS + DOT_RADIUS) {
                                dot.active = false;
                            }
                        }
                    }
                    pacmanMouthAngle += 0.05 * mouthDirection;
                    if (pacmanMouthAngle > 0.7) mouthDirection = -1;
                    if (pacmanMouthAngle < 0.2) mouthDirection = 1;
                    const mouth = 0.2 + pacmanMouthAngle * 0.3;
                    drawPacman(posX, canvas.height / 2, mouth);
                } else {
                    drawPacman(posX, canvas.height / 2, 0.1);
                    drawSmile(posX, canvas.height / 2);
                    successMsgDiv.style.display = 'block';
                    if (smileFrame === 0) {
                        setTimeout(() => {
                            cancelAnimationFrame(animationFrame);
                            animationActive = false;
                            setTimeout(() => {
                                alert('✨ Регистрация завершена! Теперь вы можете войти. (демо-режим)');
                                form.reset();
                                canvas.style.display = 'none';
                                successMsgDiv.style.display = 'none';
                            }, 1500);
                        }, 1500);
                        smileFrame = 1;
                    }
                }
                if (animationActive) {
                    animationFrame = requestAnimationFrame(animatePacman);
                }
            }

            function startPacmanAnimation() {
                if (animationActive) return;
                canvas.style.display = 'block';
                successMsgDiv.style.display = 'none';
                posX = START_X;
                animationCompleted = false;
                smileFrame = 0;
                pacmanMouthAngle = 0;
                mouthDirection = 1;
                initDots();
                animationActive = true;
                animatePacman();
            }

            // Валидация формы и запуск анимации
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const username = document.getElementById('regUsername').value.trim();
                const email = document.getElementById('regEmail').value.trim();
                const password = document.getElementById('regPassword').value;
                const confirm = document.getElementById('regConfirm').value;
                if (!username || !email || !password || !confirm) {
                    alert('❌ Заполните все поля!');
                    return;
                }
                if (password !== confirm) {
                    alert('❌ Пароли не совпадают!');
                    return;
                }
                if (password.length < 4) {
                    alert('❌ Пароль должен быть не менее 4 символов!');
                    return;
                }
                localStorage.setItem('registeredUser', username);
                localStorage.setItem('registeredEmail', email);
                startPacmanAnimation();
            });

            canvas.width = 400;
            canvas.height = 80;
            canvas.style.display = 'none';
            initDots();

            // ========== 2. ОНЛАЙН-СЧЁТЧИК ==========
            let online = 128;
            const onlineSpan = document.getElementById('onlineCount');
            if (onlineSpan) {
                setInterval(() => {
                    const change = Math.floor(Math.random() * 5) - 2;
                    online = Math.max(100, Math.min(200, online + change));
                    onlineSpan.textContent = online;
                }, 5000);
            }

            // ========== 3. ЭФФЕКТЫ: ТРЯСКА, ПОМЕХИ, ДЕМО-КЛИКИ ==========
            // Тряска при клике на навигацию
            document.querySelectorAll('nav a').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (!link.classList.contains('active')) {
                        document.body.style.animation = 'shake 0.2s';
                        setTimeout(() => document.body.style.animation = '', 200);
                    }
                    alert('🌟 Демо-версия портала! Раздел в разработке 🌟');
                });
            });

            // Случайные помехи (статик)
            setInterval(() => {
                if (Math.random() > 0.9) {
                    const crt = document.querySelector('.crt');
                    if (crt) {
                        crt.style.opacity = '0.3';
                        setTimeout(() => { if (crt) crt.style.opacity = '1'; }, 100);
                    }
                }
            }, 3000);

            // Кнопка "ПРИСОЕДИНИТЬСЯ" (имитация)
            const joinBtn = document.getElementById('joinBtn');
            if (joinBtn) {
                joinBtn.addEventListener('click', () => {
                    alert('Добро пожаловать в Retro Game Forum! Зарегистрируйтесь, чтобы стать частью сообщества.');
                });
            }

            // Социальные ссылки и ссылка "ВОЙТИ" — демо
            document.querySelectorAll('.social-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    alert('👾 Социальные сети в разработке. Следите за новостями!');
                });
            });

            const loginMock = document.getElementById('loginMockLink');
            if (loginMock) {
                loginMock.addEventListener('click', (e) => {
                    e.preventDefault();
                    alert('🔐 Страница входа будет доступна после регистрации. Пожалуйста, зарегистрируйтесь.');
                });
            }
        })();
    </script>
</body>
</html>
